<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" aria-label="Three-layer hybrid optimization architecture">
  <rect width="920" height="220" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="20" y="48" width="250" height="112" fill="#f7f7f7" stroke="#222" stroke-width="1.2"/>
  <text x="145" y="88" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="15" font-weight="700" fill="#111">Layer I</text>
  <text x="145" y="112" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="14" fill="#111">Quantum sampling</text>
  <text x="145" y="134" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="11.5" fill="#444">QAOA / biased P_raw</text>
  <line x1="270" y1="104" x2="334" y2="104" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="336" y="48" width="250" height="112" fill="#f7f7f7" stroke="#222" stroke-width="1.2"/>
  <text x="461" y="88" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="15" font-weight="700" fill="#111">Layer II</text>
  <text x="461" y="112" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="14" fill="#111">Classical refinement</text>
  <text x="461" y="134" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="11.5" fill="#444">greedy repair / P_ref</text>
  <line x1="586" y1="104" x2="650" y2="104" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="652" y="48" width="250" height="112" fill="#f7f7f7" stroke="#222" stroke-width="1.2"/>
  <text x="777" y="88" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="15" font-weight="700" fill="#111">Layer III</text>
  <text x="777" y="112" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="14" fill="#111">Formal verification</text>
  <text x="777" y="134" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="11.5" fill="#444">SMT certificate / counterexample</text>
</svg>
